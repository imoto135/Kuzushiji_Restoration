name: unetpp_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch=2.1
  - torchvision=0.16
  - pytorch-cuda=11.8
  - cudatoolkit=11.8
  - numpy=1.26          # PyTorch 2.x と互換性のある NumPy 1.x
  - pip
  - pip:
    - segmentation-models-pytorch
    - albumentations>=1.3
    - wandb
    - tqdm
    - Pillow
