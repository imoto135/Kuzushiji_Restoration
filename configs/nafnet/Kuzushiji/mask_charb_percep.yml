# ------------------------------------------------------------------------
# NAFNet for Kuzushiji Restoration (With Mask Input)
# Experiment ①: Charbonnier Loss + Perceptual Loss (VGG19)
# ------------------------------------------------------------------------
# general settings
name: NAFNet_Kuzushiji_Mask_CharbPercep
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 10

# dataset settings
datasets:
  train:
    name: Kuzushiji_Train
    type: PairedImageMaskDataset
    dataroot_gt: ../hiragana_fulldataset_5stain/gt/train
    dataroot_lq: ../hiragana_fulldataset_5stain/lq/train
    dataroot_mask: ../hiragana_fulldataset_5stain/pred_mask/train
    
    # Enable Mask Concatenation for Input
    concat_mask: true

    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 128
    use_flip: false
    use_rot: false

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8 
    batch_size_per_gpu: 64
    dataset_enlarge_ratio: 1
    prefetch_mode: cuda
    pin_memory: true
    persistent_workers: true

  val:
    name: Kuzushiji_Val
    type: PairedImageMaskDataset
    dataroot_gt: ../hiragana_fulldataset_5stain/gt/val
    dataroot_lq: ../hiragana_fulldataset_5stain/lq/val
    dataroot_mask: ../hiragana_fulldataset_5stain/pred_mask/val
    
    # Enable Mask Concatenation for Input
    concat_mask: true

    io_backend:
      type: disk

# network structures
network_g:
  type: NAFNet
  width: 32
  enc_blk_nums: [2, 2, 4, 8]
  middle_blk_num: 12
  dec_blk_nums: [2, 2, 2, 2]
  img_channel: 4
  out_channel: 3

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~
  experiments_root: ../experiments/NAFNet_Kuzushiji_Mask/charb_percep
  models: ../experiments/NAFNet_Kuzushiji_Mask/charb_percep/models
  training_states: ../experiments/NAFNet_Kuzushiji_Mask/charb_percep/training_states
  log: ../experiments/NAFNet_Kuzushiji_Mask/charb_percep
  visualization: ../experiments/NAFNet_Kuzushiji_Mask/charb_percep/visualization

# training settings
train:
  use_amp: true
  
  optim_g:
    type: AdamW
    lr: !!float 1e-3
    weight_decay: 0.
    betas: [0.9, 0.9]

  total_epoch: 200
  
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [339200]  # 200 epochs * 1696 iters
    restart_weights: [1]
    eta_min: !!float 1e-7

  warmup_iter: -1

  early_stop:
    metric: psnr
    mode: max
    patience: 15

  # ==========================================
  # Experiment ①: Charbonnier + Perceptual Loss
  # ==========================================
  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-12

  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      'conv5_4': 1.0
    vgg_type: vgg19
    use_input_norm: true
    range_norm: false
    perceptual_weight: 0.1
    style_weight: 0

# validation settings
val:
  val_freq: !!float 5e3
  save_img: true
  use_image: true

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
    masked_psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      use_mask: true
    masked_ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      use_mask: true

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: Kuzushiji_Restoration
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
