# ------------------------------------------------------------------------
# NAFNet Baseline for Kuzushiji Restoration (No Mask)
# ------------------------------------------------------------------------
# general settings
name: NAFNet_Baseline_Kuzushiji
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 10

# dataset settings
datasets:
  train:
    name: Kuzushiji_Train
    type: PairedImageMaskDataset
    dataroot_gt: ../hiragana_fulldataset_5stain/gt/train
    dataroot_lq: ../hiragana_fulldataset_5stain/lq/train
    
    # No mask used for input in nomask mode
    # dataroot_mask: ...

    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 128
    use_flip: false
    use_rot: false

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 64
    dataset_enlarge_ratio: 1
    prefetch_mode: cuda
    pin_memory: true
    persistent_workers: true

  val:
    name: Kuzushiji_Val
    type: PairedImageMaskDataset
    dataroot_gt: ../hiragana_fulldataset_5stain/gt/val
    dataroot_lq: ../hiragana_fulldataset_5stain/lq/val
    # Load mask for Metrics only, DO NOT Concatenate
    # dataroot_mask: ../hiragana_fulldataset_5stain/gt_mask/val
    concat_mask: false

    io_backend:
      type: disk

# network structures
network_g:
  type: NAFNet
  width: 32
  enc_blk_nums: [2, 2, 4, 8]
  middle_blk_num: 12
  dec_blk_nums: [2, 2, 2, 2]
  # Default img_channel=3, out_channel=3

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~
  experiments_root: ../experiments/NAFNet_Baseline_Kuzushiji
  models: ../experiments/NAFNet_Baseline_Kuzushiji/models
  training_states: ../experiments/NAFNet_Baseline_Kuzushiji/training_states
  log: ../experiments/NAFNet_Baseline_Kuzushiji
  visualization: ../experiments/NAFNet_Baseline_Kuzushiji/visualization

# training settings
train:
  use_amp: true
  
  optim_g:
    type: AdamW
    lr: !!float 1e-3
    weight_decay: 0.
    betas: [0.9, 0.9]

  total_epoch: 100
  
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [169600]
    restart_weights: [1]
    eta_min: !!float 1e-7

  warmup_iter: -1

  # early stopping
  early_stop:
    metric: psnr
    mode: max
    patience: 5

  # losses
  pixel_opt:
    type: PSNRLoss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  val_freq: !!float 5e3
  save_img: true
  use_image: true

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false


# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: Kuzushiji_Restoration
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500