# ------------------------------------------------------------------------
# Restormer for Kuzushiji Restoration (With Pred Mask Input)
# Experiment: Charbonnier Loss + Perceptual Loss (VGG19)
# MPRNet/NAFNet/SwinIR と同じ条件で比較
# restormer_env環境で実行 (GPU 1を使用)
# ------------------------------------------------------------------------
# general settings
name: Restormer_PredMask_CharbPercep_v2
model_type: ImageCleanModel
scale: 1
num_gpu: 1
manual_seed: 100

# dataset settings
datasets:
  train:
    name: Kuzushiji_Train
    type: PairedImageWithMaskDataset
    dataroot_gt: /home/imoto/Kuzushiji_Restoration/hiragana_fulldataset_5stain/gt/train
    dataroot_lq: /home/imoto/Kuzushiji_Restoration/hiragana_fulldataset_5stain/lq/train
    dataroot_mask: /home/imoto/Kuzushiji_Restoration/hiragana_fulldataset_5stain/pred_mask/train
    filelist_path: configs/train_filelist_no_ext.txt

    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 128
    use_flip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8 
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
    prefetch_mode: ~
    pin_memory: true
    phase: train
    geometric_augs: true
    
    # Progressive training settings (required by Restormer)
    iters: [200000]
    mini_batch_sizes: [8]
    gt_sizes: [128]

  val:
    name: Kuzushiji_Val
    type: PairedImageWithMaskDataset
    dataroot_gt: /home/imoto/Kuzushiji_Restoration/hiragana_fulldataset_5stain/gt/val
    dataroot_lq: /home/imoto/Kuzushiji_Restoration/hiragana_fulldataset_5stain/lq/val
    dataroot_mask: /home/imoto/Kuzushiji_Restoration/hiragana_fulldataset_5stain/pred_mask/val
    filelist_path: configs/val_filelist_no_ext.txt

    io_backend:
      type: disk
    phase: val

# network structures
network_g:
  type: Restormer
  inp_channels: 4           # RGB + Mask
  out_channels: 3
  dim: 48
  num_blocks: [4, 6, 6, 8] 
  num_refinement_blocks: 4
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
  bias: false
  LayerNorm_type: 'WithBias'
  dual_pixel_task: false

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  optim_g:
    type: AdamW
    lr: !!float 2e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  total_iter: 200000

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [200000]
    restart_weights: [1]
    eta_min: !!float 1e-7

  warmup_iter: -1

  # ==========================================
  # Experiment: Charbonnier + Perceptual Loss
  # MPRNet/NAFNet/SwinIRと同じ損失関数設定
  # ==========================================
  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-12

  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      'conv5_4': 1.0
    vgg_type: vgg19
    use_input_norm: true
    range_norm: false
    perceptual_weight: 0.1
    style_weight: 0

# validation settings
val:
  val_freq: !!float 2.5e3
  save_img: true

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: Kuzushiji_Restoration
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
